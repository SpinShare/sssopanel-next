name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    paths:
      - 'SSSOPanel/**'
      - '.github/workflows/ci.yml'

jobs:
  verify:
    name: lint & build (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # Also the runtime bundled for the voice bot, @discordjs/voice needs >=22.12
          node-version: 22.x

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install UI dependencies
        working-directory: SSSOPanel/UserInterface
        run: npm install

      - name: Lint UI
        working-directory: SSSOPanel/UserInterface
        run: npm run lint

      - name: Build UI
        working-directory: SSSOPanel/UserInterface
        run: npm run build

      - name: Stage UI build into wwwroot
        run: |
          rm -rf SSSOPanel/Resources/wwwroot/assets
          cp -r SSSOPanel/UserInterface/dist/. SSSOPanel/Resources/wwwroot/
        shell: bash

      # Runs on each matrix os, so the native @snazzah/davey prebuilt matches the rid
      - name: Install voice bot dependencies
        working-directory: SSSOPanel/VoiceBot
        run: npm ci --omit=dev --no-fund --no-audit

      - name: Bundle node runtime for the voice bot
        run: |
          mkdir -p SSSOPanel/node
          cp "$(node -p process.execPath)" SSSOPanel/node/
        shell: bash

      - name: Restore .NET dependencies
        working-directory: SSSOPanel
        run: dotnet restore --runtime ${{ matrix.rid }} SSSOPanel.csproj

      - name: Build .NET
        working-directory: SSSOPanel
        run: dotnet build SSSOPanel.csproj --configuration Release --no-restore --runtime ${{ matrix.rid }}
