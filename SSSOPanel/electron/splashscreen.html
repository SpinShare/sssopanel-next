<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SSSOPanel</title>
    <style>
        /* The window is a transparent 800x600, only the card is visible */
        html, body {
            margin: 0;
            height: 100%;
            background: transparent;
            overflow: hidden;
            user-select: none;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, sans-serif;
        }
        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            padding: 32px 48px;
            border-radius: 16px;
            background: #16161c;
            color: #fff;
        }
        .bars path {
            transform-box: fill-box;
            transform-origin: center;
            animation: pulse 1.2s ease-in-out infinite;
        }
        .bars path:nth-child(2) { animation-delay: 0.15s; }
        .bars path:nth-child(3) { animation-delay: 0.3s; }
        .bars path:nth-child(4) { animation-delay: 0.45s; }
        .bars path:nth-child(5) { animation-delay: 0.6s; }
        @keyframes pulse {
            50% { transform: scaleY(0.6); }
        }
        .label {
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Same as UserInterface/src/assets/icon.svg, inlined because only this file gets packaged -->
        <svg class="bars" width="96" height="96" viewBox="0 0 200 200">
            <path fill="#3DFB84" d="M10,150c5.52,0,10-4.48,10-10V60c0-5.52-4.48-10-10-10S0,54.48,0,60v80C0,145.52,4.48,150,10,150z"/>
            <path fill="#25A7FB" d="M50,25c-5.52,0-10,4.48-10,10v130c0,5.52,4.48,10,10,10s10-4.48,10-10V35C60,29.48,55.52,25,50,25z"/>
            <path fill="#FB1357" d="M100,190V10c0-5.52-4.48-10-10-10S80,4.48,80,10v180c0,5.52,4.48,10,10,10S100,195.52,100,190z"/>
            <path fill="#25A7FB" d="M130,25c-5.52,0-10,4.48-10,10v130c0,5.52,4.48,10,10,10s10-4.48,10-10V35C140,29.48,135.52,25,130,25z"/>
            <path fill="#3DFB84" d="M170,50c-5.52,0-10,4.48-10,10v80c0,5.52,4.48,10,10,10s10-4.48,10-10V60C180,54.48,175.52,50,170,50z"/>
        </svg>
        <div class="label">starting SSSOPanel...</div>
    </div>
</body>
</html>
